apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-k3s
  labels:
    app: django-k3s
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: django.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-k3s
                port:
                  number: 80
