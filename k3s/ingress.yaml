apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-k3s
  labels:
    app: django-k3s
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-k3s
                port:
                  number: 80
