apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-k3s
  labels:
    app: django-k3s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-k3s
  template:
    metadata:
      labels:
        app: django-k3s
    spec:
      containers:
        - name: django-k3s
          image: mrfahad0907/django-k3s:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
